name: Scala Steward

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    name: Scala Steward
    permissions:
      contents: read
      actions: write
    env:
      SBT_OPTS: -Xmx2G
    steps:
      # Need to checkout the repo for reading repos.md
      - uses: actions/checkout@v5
      - name: Cache artifacts
        id: cache-artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/local
            ~/.sbt
            ~/.cache
          key: ${{ runner.os }}-sc-artifacts
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
         java-version: 21
         distribution: zulu
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.REPO_GITHUB_TOKEN }}
          author-email: 'leo+bot@xerial.org'
          # scala-steward-version: ''
          repos-file: 'repos.md'
          other-args: '--add-labels'
          max-buffer-size: 1048576
      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling this workflow via the API on each run resets that timer.
      - name: Keep workflow alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable scala-steward.yml -R ${{ github.repository }}
